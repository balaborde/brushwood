name: Translation problem
description: A wrong, awkward, missing or cut-off text in one of Brushwood's languages.
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: |
        Most translations have not been reviewed by native speakers yet, so every correction helps. You can also fix
        the text yourself: see [Translations](https://github.com/balaborde/brushwood/blob/main/CONTRIBUTING.md#translations).
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Deutsch
        - Español
        - Français
        - Italiano
        - Nederlands
        - Polski
        - Português (Brasil)
        - Русский
        - 日本語
        - 한국어
        - 简体中文
        - English
        - A language Brushwood doesn't have yet
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where does the text appear?
      description: Menu, tool bar, dialog, window… A screenshot helps a lot.
    validations:
      required: true
  - type: input
    id: current
    attributes:
      label: Current text
  - type: input
    id: suggested
    attributes:
      label: Suggested text
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
